# The offline library: kiwix-serve over every ZIM file in one volume on the USB disks,
# plus a downloader beside it that keeps the ZIMs listed in zims.txt current.
#
# Add or remove a book by editing zims.txt below and committing. The downloader
# re-reads the list every round (CHECK_HOURS), fetches what is missing or has a
# newer edition, checks Kiwix's published sha256, and only then swaps it in.
# It never deletes a book because a line was removed, and never deletes the old
# edition until the new one has downloaded and verified. With no internet it
# changes nothing and the library keeps serving what it has.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-library
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 400Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiwix-library
data:
  # <folder on download.kiwix.org/zim/> <file name without the _YYYY-MM.zim date>
  # Sizes as of 2026-11. The starter set is about 15 GB.
  zims.txt: |
    # Survival, medicine, water, food (Kiwix's own curated sets)
    other           zimgit-post-disaster_en
    other           zimgit-medicine_en
    other           zimgit-water_en
    other           zimgit-food-preparation_en
    other           zimgit-knots_en
    wikipedia       wikipedia_en_medicine_maxi
    # Fixing things
    ifixit          ifixit_en_all
    stack_exchange  diy.stackexchange.com_en_all
    stack_exchange  mechanics.stackexchange.com_en_all
    stack_exchange  bicycles.stackexchange.com_en_all
    stack_exchange  woodworking.stackexchange.com_en_all
    # Food, garden, outdoors, radio
    stack_exchange  cooking.stackexchange.com_en_all
    stack_exchange  gardening.stackexchange.com_en_all
    stack_exchange  sustainability.stackexchange.com_en_all
    stack_exchange  outdoors.stackexchange.com_en_all
    stack_exchange  ham.stackexchange.com_en_all
    stack_exchange  medicalsciences.stackexchange.com_en_all
    # Travel guides and how-to books (Wikibooks includes the Cookbook)
    wikivoyage      wikivoyage_en_all_maxi
    wikibooks       wikibooks_en_all_maxi
    # Big ones: uncomment when wanted (check the disk and the data costs of the
    # home connection first).
    # wikipedia       wikipedia_en_all_maxi
    # gutenberg       gutenberg_en_all
    # stack_exchange  electronics.stackexchange.com_en_all
    # libretexts      libretexts.org_en_med

  fetch.sh: |
    #!/bin/sh
    # Keeps /data stocked with the newest edition of each ZIM in /config/zims.txt.
    set -u
    BASE="${KIWIX_MIRROR:-https://download.kiwix.org/zim}"
    RESERVE=$((10 * 1024 * 1024 * 1024))   # always leave 10 GiB free on the disk
    cd /data || exit 1
    log() { echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') $*"; }

    # The newest file on the server for a folder and name, or nothing (offline, renamed).
    newest() {
      curl -fsSL --max-time 120 "$BASE/$1/" \
        | grep -o "href=\"$2_[0-9]\{4\}-[0-9]\{2\}\.zim\"" \
        | sed 's/^href="//; s/"$//' | sort | tail -n 1
    }

    fetch_one() {
      dir=$1; file=$2
      size=$(curl -fsSIL --max-time 60 "$BASE/$dir/$file" | grep -i '^content-length:' | tail -n 1 | tr -cd '0-9')
      size=${size:-0}
      have=0; [ -e "$file.part" ] && have=$(stat -c %s "$file.part")
      free_kb=$(df -Pk /data | tail -n 1 | tr -s ' ' | cut -d ' ' -f 4)
      if [ $((free_kb * 1024 - (size - have))) -lt "$RESERVE" ]; then
        log "skip $file: needs $((size - have)) more bytes, only $((free_kb * 1024)) free"
        return 1
      fi
      if [ "$size" -gt 0 ] && [ "$have" -eq "$size" ]; then
        log "$file is already fully downloaded; verifying"
      else
        log "downloading $file ($size bytes, $have already here)"
        if ! curl -fL --no-progress-meter --retry 5 --retry-delay 30 --speed-limit 1000 --speed-time 300 \
            -C - -o "$file.part" "$BASE/$dir/$file"; then
          log "download of $file stopped; it resumes next round"
          return 1
        fi
      fi
      want=$(curl -fsSL --max-time 60 "$BASE/$dir/$file.sha256" | cut -d ' ' -f 1)
      got=$(sha256sum "$file.part" | cut -d ' ' -f 1)
      if [ -n "$want" ] && [ "$want" != "$got" ]; then
        log "checksum mismatch on $file: discarded"
        rm -f "$file.part"
        return 1
      fi
      [ -z "$want" ] && log "no published checksum for $file; keeping it unverified"
      mv "$file.part" "$file"
      log "ready: $file"
    }

    while true; do
      grep -v '^[[:space:]]*\(#\|$\)' /config/zims.txt | while read -r dir name; do
        [ -n "${name:-}" ] || continue
        latest=$(newest "$dir" "$name")
        if [ -z "$latest" ]; then
          log "nothing found for $dir/$name (offline, or the name changed)"
          continue
        fi
        [ -e "$latest" ] && continue
        if fetch_one "$dir" "$latest"; then
          for old in "${name}"_*.zim; do
            if [ -e "$old" ] && [ "$old" != "$latest" ]; then rm -f "$old"; log "replaced $old"; fi
          done
        fi
      done
      log "round done; $(ls -1 /data/*.zim 2>/dev/null | wc -l) books on hand; next round in ${CHECK_HOURS:-24}h"
      sleep $(( ${CHECK_HOURS:-24} * 3600 ))
    done

  serve.sh: |
    #!/bin/sh
    # Serves every finished ZIM in /data. When the set of files changes, rebuilds
    # library.xml, which kiwix-serve watches (--monitorLibrary), so no restart.
    cd /data || exit 1
    books() { ls -1 *.zim 2>/dev/null; }
    rebuild() {
      rm -f library.xml.new
      for f in $(books); do
        kiwix-manage library.xml.new add "/data/$f" >/dev/null 2>&1 || echo "could not add $f"
      done
      [ -e library.xml.new ] && mv library.xml.new library.xml
    }
    until [ -n "$(books)" ]; do
      echo "waiting for the first book to finish downloading"
      sleep 30
    done
    rebuild
    last=$(books | md5sum)
    kiwix-serve --port=8080 --library --monitorLibrary /data/library.xml &
    pid=$!
    while sleep 30; do
      kill -0 "$pid" 2>/dev/null || exit 1
      now=$(books | md5sum)
      if [ "$now" != "$last" ]; then
        rebuild
        last=$now
        echo "library now has $(books | wc -l) books"
      fi
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  labels:
    app.kubernetes.io/name: kiwix
spec:
  replicas: 1
  # One pod owns the volume; never two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kiwix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiwix
    spec:
      # The USB data disks are on k8s-01 and k8s-03; local-path skips k8s-02.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-01, k8s-03]
      containers:
        - name: serve
          image: ghcr.io/kiwix/kiwix-tools:3.8.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/serve.sh"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
        - name: fetch
          image: curlimages/curl:8.22.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/config/fetch.sh"]
          env:
            - name: CHECK_HOURS
              value: "24"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      # The curl image runs as uid 100; local-path creates its folders world-writable,
      # so both containers can write the volume without an fsGroup.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kiwix-library
        - name: config
          configMap:
            name: kiwix-library
---
apiVersion: v1
kind: Service
metadata:
  name: kiwix
  annotations:
    metallb.io/loadBalancerIPs: 10.27.28.203
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kiwix
  ports:
    - name: http
      port: 80
      targetPort: http
