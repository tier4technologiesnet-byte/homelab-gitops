# podinfo, a small demo web app, scraped by Prometheus through its ServiceMonitor.
defaultNamespace: podinfo

# The ServiceMonitor CRD comes from the monitoring bundle, so deploy that first.
dependsOn:
  - selector:
      matchLabels:
        app: monitoring

helm:
  releaseName: podinfo
  repo: https://stefanprodan.github.io/podinfo
  chart: podinfo
  version: 6.15.0
  values:
    replicaCount: 2
    service:
      type: LoadBalancer
      # The firewall only lets the home LAN reach this cluster on standard
      # ports, so serve on 80 instead of opening 9898.
      externalPort: 80
    serviceMonitor:
      enabled: true
